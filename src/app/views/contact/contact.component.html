<!-- Contact Section -->
<section class="section" id="contact">
    <div class="container">
        <div class="section-title">
            <h2>Get a Free Quote</h2>
            <p>Ready to move? Contact us today for a free, no-obligation quote.</p>
        </div>
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="move-date">Move Date</label>
                <input type="date" id="move-date" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="message">Additional Details</label>
                <textarea id="message" class="form-control"></textarea>
            </div>
            <button type="submit" class="btn">Request Quote</button>
        </form>
    </div>
</section>
<ul>
    <li *ngFor="let user of users">
            {{user.name}} - {{user.email}} -{{user.id}}--  {{user.date}}
    </li>

</ul>
